<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vivid Cinema · Cast</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#050609;color:#fff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#050609;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#player{width:100%;height:100%;border:0;display:none;background:#000}
#idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:48px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.08),transparent 42%),#07080b}
#idle div{max-width:720px}
.logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:18px;font-weight:700;font-size:28px;letter-spacing:-.04em}
.logo img{width:42px;height:42px;display:block}
.kicker{display:block;color:#8d95a1;font-size:13px;letter-spacing:.18em;font-weight:700;margin-bottom:8px}
h1{margin:0;font-size:clamp(28px,5vw,56px);letter-spacing:-.05em}
p{color:#858d99;font-size:16px}
#title{position:fixed;left:24px;bottom:22px;max-width:60%;display:none;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.62);backdrop-filter:blur(16px);font-size:16px}
</style>
</head>
<body>
<div id="stage">
  <div id="idle">
    <div>
      <div class="logo"><img src="./icons/vivid-icon.svg" alt=""><span>Vivid Cinema</span></div>
      <span class="kicker">READY TO CAST</span>
      <h1>Choose something to watch on Vivid.</h1>
      <p>Start playback from your phone or browser.</p>
    </div>
  </div>
  <iframe id="player" title="Vivid Cinema playback" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="origin"></iframe>
  <div id="title"></div>
</div>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script>
const NAMESPACE="urn:x-cast:com.vividcinema.cast";
const ALLOWED_ORIGIN="https://vaplayer.ru";
const context=cast.framework.CastReceiverContext.getInstance();
const player=document.getElementById("player");
const idle=document.getElementById("idle");
const title=document.getElementById("title");

function loadMedia(data){
  const url=String(data?.url||"");
  let parsed;
  try{parsed=new URL(url)}catch{return}
  if(parsed.origin!==ALLOWED_ORIGIN)return;
  player.src=url;
  player.style.display="block";
  idle.style.display="none";
  title.textContent=String(data?.title||"Vivid Cinema");
  title.style.display="block";
  document.title=(data?.title?String(data.title)+" · ":"")+"Vivid Cinema";
}

context.addCustomMessageListener(NAMESPACE,event=>{
  if(event?.data?.type==="LOAD_VIVID_MEDIA")loadMedia(event.data);
});

context.start();
</script>
</body>
</html>
