<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Vivid Cinema</title>
  
  <!-- Favicon -->
  <link rel="shortcut icon" href="fav-icon.png" type="image/x-icon" />
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">

  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }
    .contact-container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 2.5rem;
      background: linear-gradient(145deg, #111, #1c1c1c);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      animation: fadeIn 1s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .contact-container h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      color: #e50914;
    }
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .contact-form input,
    .contact-form textarea {
      padding: 1rem;
      border-radius: 6px;
      border: none;
      background: #222;
      color: #fff;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      background: #333;
      outline: none;
    }
    .contact-form button {
      padding: 1rem;
      background: #e50914;
      color: white;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .contact-form button:hover {
      background: #b00610;
    }
    .success-message {
      display: none;
      background: #28a745;
      padding: 1rem;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
    }
    .map-container {
      margin-top: 3rem;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }
    iframe {
      width: 100%;
      height: 350px;
      border: none;
    }
    @media (max-width: 600px) {
      .contact-container {
        margin: 1.5rem;
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="contact-container">
    <h2>Contact Us</h2>

    <form id="contactForm" class="contact-form" method="POST" enctype="multipart/form-data" action="https://formspree.io/f/mwpokaav">
      <input type="text" name="name" placeholder="Your Full Name" required />
      <input type="email" name="email" placeholder="Your Email Address" required />
      <input type="tel" name="phone" placeholder="Phone Number (optional)" />
      <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
      <input type="file" name="screenshot" accept="image/*" />
      <button type="submit">Send Message</button>
      <div class="success-message" id="successMsg">✅ Message sent successfully!</div>
    </form>

  </div>

  <!-- Form Submit -->
  <script>
    const form = document.getElementById("contactForm");
    const successMsg = document.getElementById("successMsg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      try {
        const res = await fetch(form.action, {
          method: "POST",
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          successMsg.style.display = "block";
          form.reset();
          setTimeout(() => {
            successMsg.style.display = "none";
          }, 5000);
        } else {
          alert("Message failed to send. Please try again later.");
        }
      } catch (error) {
        alert("An error occurred. Please try again later.");
      }
    });
  </script>


</body>
</html>
