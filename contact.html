<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="description" content="Contact Vivid Cinema for account, content, accessibility and security support."><meta name="robots" content="index,follow"><title>Contact · Vivid Cinema</title><link rel="icon" href="fav-icon.png" type="image/png"><link rel="stylesheet" href="styles/vivid-legal.css"></head>
<body class="vivid-legal-page"><header class="vivid-legal-nav"><a class="vivid-legal-brand" href="home.html">Vivid<span>Cinema</span></a><nav class="vivid-legal-navlinks"><a href="home.html">Home</a><a href="discover.html">Discover</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></nav></header>
<main class="vivid-legal-main"><div class="vivid-legal-eyebrow">Vivid Cinema</div><h1>Contact</h1><p class="vivid-legal-intro">Tell us what happened and include enough detail for us to understand the issue.</p>
<section class="vivid-legal-card"><form id="contactForm" class="vivid-contact-form" method="POST" enctype="multipart/form-data" action="https://formspree.io/f/mwpokaav"><label>Name<input name="name" autocomplete="name" maxlength="100" required></label><label>Email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><label>Reason<select name="reason" required><option value="">Choose a reason</option><option>Account help</option><option>Playback or title issue</option><option>Accessibility</option><option>Privacy request</option><option>Security report</option><option>Other</option></select></label><label>Message<textarea name="message" rows="7" maxlength="5000" required></textarea></label><label>Screenshot (optional)<input type="file" name="screenshot" accept="image/*"></label><p class="vivid-legal-note">Never send a password, verification code, payment-card number or other sensitive credential.</p><button type="submit">Send message</button><div id="contact-status" class="vivid-contact-status" role="status" aria-live="polite"></div></form></section><a class="vivid-legal-back" href="home.html">← Back to Vivid Cinema</a></main><footer class="vivid-legal-footer">© 2026 Vivid Cinema · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></footer>
<script>
const form=document.getElementById("contactForm"),status=document.getElementById("contact-status");
form.addEventListener("submit",async event=>{event.preventDefault();status.textContent="Sending…";try{const response=await fetch(form.action,{method:"POST",body:new FormData(form),headers:{Accept:"application/json"}});if(!response.ok)throw new Error();form.reset();status.textContent="Message sent. Thanks."; }catch{status.textContent="We couldn't send that right now. Please try again later."; }});
</script></body></html>
