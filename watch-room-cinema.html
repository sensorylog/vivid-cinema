<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101019">
  <title>Opening your Vivid Watch Room…</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#101019;color:#f4efff}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;text-align:center}
    p{max-width:32rem;color:#bdb5ca;line-height:1.6}
  </style>
</head>
<body>
  <main>
    <p>Opening your screening inside the room. Your queue, chat, members and voice controls now live together in one place.</p>
  </main>
  <script>
    const target = new URL("watch-rooms.html", window.location.href);
    const incoming = new URLSearchParams(window.location.search);
    for (const [key, value] of incoming) target.searchParams.set(key, value);
    if (target.searchParams.get("roomId") && target.searchParams.get("id")) {
      target.searchParams.set("roomMode", "1");
    } else {
      target.searchParams.delete("roomMode");
    }
    window.location.replace(target.href);
  </script>
</body>
</html>
