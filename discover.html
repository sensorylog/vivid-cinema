<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070a"><meta name="description" content="Discover movies and TV series on Vivid Cinema.">
<title>Discover · Vivid Cinema</title><link rel="icon" href="fav-icon.png" type="image/x-icon">
<link rel="stylesheet" href="styles/vivid-foundation.css"><link rel="stylesheet" href="styles/vivid-system.css"><link rel="stylesheet" href="styles/vivid-shell.css"><link rel="stylesheet" href="styles/vivid-discovery.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="fav-icon.png">
  <link rel="stylesheet" href="styles/vivid-pwa.css">
</head>
<body data-vivid-page="discover" class="vivid-discovery-page">
<div class="vivid-discovery-app">
<header class="vivid-discovery-nav">
<a class="vivid-brand" href="home.html">Vivid<span>Cinema</span></a>
<nav aria-label="Primary"><a href="home.html">Home</a><a class="is-active" href="discover.html" aria-current="page">Discover</a><a href="account.html">My Library</a></nav>
<a class="vivid-nav-action" id="discover-auth" href="auth.html">Sign in</a>
</header>
<main class="vivid-discovery-main">
<section class="vivid-discovery-intro">
<div><span class="vivid-discovery-kicker">EXPLORE</span><h1>Find your next story.</h1><p>Search the catalogue or shape your results with filters.</p></div>
<div class="vivid-discovery-search"><i class="bi bi-search" aria-hidden="true"></i><input id="discovery-search" type="search" placeholder="Search movies, series, actors..." aria-label="Search the catalogue" autocomplete="off"><button id="clear-search" type="button" aria-label="Clear search" hidden><i class="bi bi-x"></i></button></div>
</section>
<section class="vivid-filter-panel" aria-label="Discovery filters">
<div class="vivid-filter-row vivid-type-row" role="group" aria-label="Content type">
<button class="is-active" data-type="all" type="button">All</button><button data-type="movie" type="button">Movies</button><button data-type="tv" type="button">TV</button>
</div>
<div class="vivid-filter-row">
<label>Genre<select id="genre-filter"><option value="">All genres</option></select></label>
<label>Year<select id="year-filter"><option value="">Any year</option></select></label>
<label>Sort<select id="sort-filter"><option value="popularity.desc">Most popular</option><option value="vote_average.desc">Highest rated</option><option value="primary_release_date.desc">Newest</option><option value="primary_release_date.asc">Oldest</option></select></label>
<button id="reset-filters" class="vivid-filter-reset" type="button">Reset</button>
</div>
</section>
<section class="vivid-discovery-results" aria-live="polite">
<div class="vivid-results-head"><div><span id="results-label">DISCOVER</span><h2 id="results-title">All titles</h2></div><span id="results-count"></span></div>
<div id="discovery-grid" class="vivid-discovery-grid"><div class="vivid-discovery-loading" aria-label="Loading titles"></div></div>
<div id="discovery-empty" class="vivid-discovery-empty" hidden><i class="bi bi-search"></i><h2>No titles found</h2><p>Try a different search or loosen one of the filters.</p></div>
<div class="vivid-pagination"><button id="prev-page" type="button"><i class="bi bi-chevron-left"></i> Previous</button><span id="page-label">Page 1</span><button id="next-page" type="button">Next <i class="bi bi-chevron-right"></i></button></div>
</section>
</main>
<footer class="vivid-footer">© 2026 Vivid Cinema · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="contact.html">Contact</a></footer>
</div>
<script type="module" src="scripts/app-shell.js"></script><script type="module" src="scripts/nav-auth.js"></script><script type="module" src="scripts/discover.js"></script>
  <script type="module" src="scripts/pwa.js"></script>
</body></html>
