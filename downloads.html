<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Download Movies - MovieVel</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    .movie-box .box-text {
      padding-top: 0.5rem;
    }
    .movie-box p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .download-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }
    .download-buttons .watch-btn {
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="nav container">
    <a href="index.html" class="logo">Movie<span>Vel</span></a>
    <a href="index.html" class="signup-btn">← Back to Home</a>
  </header>

  <!-- Download Section -->
  <main class="container" style="margin-top: 5rem;">
    <h2 class="heading-title text-center">🎬 Downloadable Movies</h2>
    <div class="movies-content" id="downloadable-movies-container"></div>
  </main>

  <!-- Footer -->
  <footer class="copyright" style="margin-top: 2rem;">
    <p>&#169; 2025 MovieVel All Rights Reserved</p>
  </footer>

  <script>
    const downloadableMovies = [
      {
        title: "Night of the Living Dead",
        year: 1968,
        quality: ["MP4", "HD", "3GP"],
        description: "A group of people hide from bloodthirsty zombies in a farmhouse.",
        poster: "https://upload.wikimedia.org/wikipedia/commons/a/a6/Night_of_the_Living_Dead_%281968%29.jpg",
        links: {
          MP4: "https://archive.org/download/night_of_the_living_dead/night_of_the_living_dead_512kb.mp4",
          HD: "https://archive.org/download/night_of_the_living_dead/night_of_the_living_dead_1024kb.mp4",
          "3GP": "https://archive.org/download/night_of_the_living_dead/night_of_the_living_dead.3gp"
        }
      },
      {
        title: "Sherlock Holmes",
        year: 1916,
        quality: ["MP4", "HD"],
        description: "The world's most famous detective in a classic silent film.",
        poster: "https://upload.wikimedia.org/wikipedia/commons/e/e3/Sherlock_Holmes_%281916_film%29_poster.jpg",
        links: {
          MP4: "https://archive.org/download/SherlockHolmes1916/SherlockHolmes1916.mp4",
          HD: "https://archive.org/download/SherlockHolmes1916/SherlockHolmes1916_HD.mp4"
        }
      }
    ];

    function renderDownloadableMovies() {
      const container = document.getElementById("downloadable-movies-container");
      container.innerHTML = downloadableMovies.map(movie => {
        const downloadButtons = movie.quality.map(q => `
          <a href="${movie.links[q]}" target="_blank" rel="noopener" class="watch-btn">
            ⬇ ${q}
          </a>`).join("");

        return `
          <div class="movie-box" style="max-width: 250px;">
            <img src="${movie.poster}" alt="${movie.title}" class="movie-box-img" />
            <div class="box-text">
              <h3 class="movie-title">${movie.title}</h3>
              <p class="movie-type">${movie.year}</p>
              <p>${movie.description}</p>
              <div class="download-buttons">${downloadButtons}</div>
            </div>
          </div>`;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", renderDownloadableMovies);
  </script>
</body>
</html>
