<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch | Vivid Cinema</title>
  <meta name="description" content="Stream your selected movie ad-free on Vivid Cinema. Immersive viewing experience." />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="swiper-bundle.min.css" />
  <style>
    :root {
      --bg: #0d1117;
      --accent: #ffdc5e;
      --text: #d8e1f0;
      --title: #ffffff;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
    }
    nav .logo {
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: 700;
      text-decoration: none;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }
    nav ul a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
    }
    .container {
      max-width: 1200px;
      margin: 6rem auto 2rem;
      padding: 0 1rem;
    }
    .btn-row {
      display: flex;
      gap: 1rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .watch-btn {
      background: var(--accent);
      color: var(--bg);
      padding: 0.6rem 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }
    .watch-btn:hover {
      background: #e0b943;
    }
    .comment-section {
      margin-top: 2rem;
    }
    .comment-section h3 {
      margin-bottom: 0.5rem;
      color: var(--title);
    }
    .comment-section textarea {
      width: 100%;
      padding: 0.5rem;
      font-family: inherit;
      font-size: 1rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }
    .comment-section .comment {
      background: #1a1f2a;
      padding: 0.8rem;
      border-radius: 6px;
      margin-top: 0.5rem;
    }
    .comment-section .comment p {
      margin: 0;
    }
    footer {
      background: #12151c;
      padding: 2rem;
      text-align: center;
      color: #777;
      font-size: 0.9rem;
      margin-top: 4rem;
    }
    @media (max-width: 768px) {
      .details {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">Vivid Cinema</a>
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="movies.html">Movies</a></li>
      <li><a href="auth.html">Sign Up</a></li>
    </ul>
  </nav>

  <div class="container" id="watch-container"></div>

  <footer>
    &copy; 2025 Vivid Cinema. All rights reserved. |
    <a href="privacy.html" style="color:#777;">Privacy Policy</a> |
    <a href="terms.html" style="color:#777;">Terms of Use</a>
  </footer>

  <script src="swiper-bundle.min.js"></script>
  <script src="watch.js" defer></script>
</body>
</html>
