<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6559393992371691"
     crossorigin="anonymous"></script>
  <script type="text/javascript">
    (function(c) {
      var script = document.createElement("script");
      script.src = "https://js.memberful.com/embed.js";
      script.onload = function() { Memberful.setup(c) };
      document.head.appendChild(script);
    })({
      site: ["https://vividcinema.memberful.com"]
    });
  </script>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In - Vivid Cinema</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js"></script>
  <style>
    .auth-container {
      max-width: 420px;
      margin: 6rem auto 2rem;
      padding: 2rem;
      background: var(--container-color);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .auth-container input {
      width: 100%;
      margin-bottom: 1rem;
      border: none;
      border-radius: 5px;
      background: #2c2c2c;
      color: var(--text-color);
      padding: 0.9rem;
    }
    .auth-switch { text-align: center; margin-top: 1rem; }
    .auth-switch a { color: var(--main-color); font-weight: 500; }
    .error-msg { color: red; font-size: 0.9rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header class="nav container">
    <a href="Home.html" class="logo">Vivid<span>Cinema</span></a>
    <a href="auth.html" id="auth-link">Sign Up</a>
    <div id="user-dropdown" class="hidden">
      <span id="user-email"></span>
      <a href="#" id="logout-link">Log Out</a>
    </div>
  </header>

  <main class="auth-container">
    <h1>Log In</h1>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <div class="error-msg" id="login-error-msg"></div>
      <button type="submit" class="watch-btn">Log In</button>
    </form>
    <div class="auth-switch">
      Don't have an account? <a href="auth.html">Sign Up</a>
    </div>
  </main>

  <script type="module" src="scripts/scripts/auth.js"></script>

</body>
</html>
