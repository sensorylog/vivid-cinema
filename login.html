<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Log In | Vivid Cinema</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="styles/vivid-shell.css"><link rel="stylesheet" href="styles/vivid-auth.css"></head><body data-vivid-page="login"><header class="nav container"><a href="index.html" class="logo">Vivid<span>Cinema</span></a></header><main class="auth-container"><h1>Log In</h1><form id="login-form"><input type="email" id="login-email" placeholder="Email" autocomplete="email" required><input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required><div class="error-msg" id="login-error-msg" aria-live="polite"></div><button type="submit" class="watch-btn">Log In</button></form><div class="auth-divider">or</div><button type="button" class="watch-btn google-auth" data-google-auth>Continue with Google</button><p><a href="#" id="reset-password">Forgot password?</a></p><div class="auth-switch">Don't have an account? <a href="auth.html">Create one</a></div></main><script type="module" src="scripts/auth.js"></script></body></html>
