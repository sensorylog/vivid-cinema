<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Vivid Cinema</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth-container{max-width:420px;margin:6rem auto 2rem;padding:2rem;background:var(--container-color);border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.4)}
    .auth-container input{width:100%;margin-bottom:1rem;border:0;border-radius:5px;background:#2c2c2c;color:var(--text-color);padding:.9rem}
    .auth-switch{text-align:center;margin-top:1rem}.auth-switch a{color:var(--main-color);font-weight:500}
    .error-msg{min-height:1.3rem;font-size:.9rem;margin-bottom:1rem}
  </style>
  <link rel="stylesheet" href="styles/vivid-shell.css">
</head>
<body data-vivid-page="login">
  <header class="nav container"><a href="index.html" class="logo">Vivid<span>Cinema</span></a></header>
  <main class="auth-container">
    <h1>Log In</h1>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" autocomplete="email" required>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <div class="error-msg" id="login-error-msg" aria-live="polite"></div>
      <button type="submit" class="watch-btn">Log In</button>
    </form>
    <p><a href="#" id="reset-password">Forgot password?</a></p>
    <div class="auth-switch">Don't have an account? <a href="auth.html">Create one</a></div>
  </main>
  <script type="module" src="scripts/auth.js"></script>
</body>
</html>
