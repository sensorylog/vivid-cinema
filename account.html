<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | Vivid Cinema</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .account-shell{max-width:1000px;margin:6rem auto 3rem;padding:0 1rem}
    .account-card{background:#222;border-radius:10px;padding:2rem}
    .account-card input{width:100%;max-width:520px;background:#333;color:#fff;border:1px solid #444;border-radius:6px;padding:.8rem}
    .account-actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}
    .section-title{margin:2rem 0 1rem}
    .empty-state{padding:1.5rem;background:#1b1b1b;border-radius:8px;color:#aaa}
  </style>
</head>
<body>
  <header class="nav container">
    <a href="index.html" class="logo">Vivid<span>Cinema</span></a>
    <a href="home.html">Browse</a>
  </header>
  <main class="account-shell">
    <section class="account-card">
      <h1>My Account</h1>
      <p id="account-status">Checking your session…</p>
      <label for="user-email">Email</label>
      <input id="user-email" type="email" disabled>
      <label for="user-name">Name</label>
      <input id="user-name" type="text" placeholder="Your name">
      <div class="account-actions">
        <button id="save-btn" class="watch-btn" type="button">Save Changes</button>
        <button id="logout-btn" class="watch-btn" type="button">Log Out</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Watch History</h2>
      <div id="history-list" class="empty-state">Watch history will be synced to your account in the next data-layer upgrade.</div>
    </section>
    <section>
      <h2 class="section-title">Favorites</h2>
      <div id="fav-list" class="empty-state">Your current favorites remain available on this device. Cross-device sync is part of the next upgrade.</div>
    </section>
  </main>
  <script type="module">
    import { auth, db } from "./scripts/firebase.js";
    import { onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";

    const emailEl=document.getElementById("user-email");
    const nameEl=document.getElementById("user-name");
    const statusEl=document.getElementById("account-status");

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ window.location.href="login.html"; return; }
      emailEl.value=user.email||"";
      nameEl.value=user.displayName||"";
      statusEl.textContent="Signed in";
      try{
        const snap=await getDoc(doc(db,"users",user.uid));
        if(snap.exists() && snap.data().displayName && !nameEl.value) nameEl.value=snap.data().displayName;
      }catch(error){ console.error(error); }
    });

    document.getElementById("save-btn").addEventListener("click", async ()=>{
      const user=auth.currentUser;
      if(!user) return;
      const name=nameEl.value.trim();
      try{
        await updateProfile(user,{displayName:name});
        await setDoc(doc(db,"users",user.uid),{displayName:name,email:user.email},{merge:true});
        statusEl.textContent="Changes saved.";
      }catch(error){
        console.error(error);
        statusEl.textContent="Could not save changes.";
      }
    });

    document.getElementById("logout-btn").addEventListener("click", async ()=>{
      await signOut(auth);
      window.location.href="login.html";
    });
  </script>
</body>
</html>
