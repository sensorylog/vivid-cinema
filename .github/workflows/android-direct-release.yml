name: Vivid Cinema Android Direct Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-direct-release.yml
  workflow_dispatch:
    inputs:
      android_version:
        description: Independent Android version (start at 1.0.0; increment for each APK release)
        required: true
        type: string
        default: "1.0.0"
      bridge_legacy_release:
        description: Also mirror this APK to the current Windows release so older Android installs can discover their first update
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: vivid-android-direct-release
  cancel-in-progress: false

jobs:
  release-guard:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.guard.outputs.should_build }}
      android_version: ${{ steps.guard.outputs.android_version }}
      legacy_bridge_tag: ${{ steps.guard.outputs.legacy_bridge_tag }}
    steps:
      - name: Check whether this Android release tag is new
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_VERSION_INPUT: ${{ inputs.android_version || '1.0.0' }}
          BRIDGE_LEGACY_RELEASE: ${{ inputs.bridge_legacy_release }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v$ANDROID_VERSION_INPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Android release $tag already exists. Choose the next Android version."
              exit 1
            fi
            echo "Android release $tag already exists; skipping this workflow-file maintenance push."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "android_version=$ANDROID_VERSION_INPUT" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$BRIDGE_LEGACY_RELEASE" = "true" ]; then
            echo "legacy_bridge_tag=v1.0.47" >> "$GITHUB_OUTPUT"
          else
            echo "legacy_bridge_tag=" >> "$GITHUB_OUTPUT"
          fi

  build-test-publish:
    needs: release-guard
    if: needs.release-guard.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Validate Android release version and assign monotonic build
        shell: bash
        env:
          ANDROID_VERSION_INPUT: ${{ needs.release-guard.outputs.android_version }}
        run: |
          set -euo pipefail
          if [[ ! "$ANDROID_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Android version must use MAJOR.MINOR.PATCH, for example 1.0.0."
            exit 1
          fi
          build_number=$((2000000 + GITHUB_RUN_NUMBER))
          version_code=$((100000 + build_number))
          if (( version_code >= 2100000000 )); then
            echo "::error::Android versionCode exceeds the supported Play/Android range."
            exit 1
          fi
          echo "VIVID_ANDROID_VERSION=$ANDROID_VERSION_INPUT" >> "$GITHUB_ENV"
          echo "VIVID_ANDROID_BUILD=$build_number" >> "$GITHUB_ENV"
          echo "VIVID_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VIVID_ANDROID_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "Android version: $ANDROID_VERSION_INPUT; build: $build_number; versionCode: $version_code"

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      - name: Run Android update and native regression tests
        run: |
          node --test tests/android-auto-update.test.mjs tests/android-native-polish.test.mjs tests/android-release-pipeline.test.mjs tests/watch-player.test.mjs tests/watch-room-voice.test.mjs tests/watch-room-api.test.mjs tests/playback-structure.test.mjs
          npm run check:syntax

      - name: Build the local web bundle
        run: npm run build:static

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync the Android project
        run: npm run cap:sync

      - name: Configure Android v1 version and native updater
        run: node automation/configure-android-native-project.mjs

      - name: Restore the established Vivid Android signing identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          key_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(any(.assets[]?; .name == "Vivid-Cinema-Debug.keystore")) | .tag_name' | head -n 1)"
          if [ -z "$key_tag" ]; then
            echo "::error::The established Android signing key was not found in historical releases. Refusing to generate a new key because that would break in-place updates."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vivid-android-key" "$HOME/.android"
          gh release download "$key_tag" --repo "$GITHUB_REPOSITORY" --pattern "Vivid-Cinema-Debug.keystore" --dir "$RUNNER_TEMP/vivid-android-key"
          test -s "$RUNNER_TEMP/vivid-android-key/Vivid-Cinema-Debug.keystore"
          cp "$RUNNER_TEMP/vivid-android-key/Vivid-Cinema-Debug.keystore" "$HOME/.android/debug.keystore"
          echo "Restored the existing Vivid Cinema Android signing identity from $key_tag."

      - name: Apply the shared Vivid Cinema launcher icon
        run: node automation/apply-android-icon.mjs

      - name: Build Android v1 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
          cd ..
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Vivid-Cinema-Android.apk
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print -quit)"
          test -n "$apksigner_path"
          test -n "$aapt_path"
          "$apksigner_path" verify --verbose release-output/Vivid-Cinema-Android.apk
          package_info="$("$aapt_path" dump badging release-output/Vivid-Cinema-Android.apk | head -n 1)"
          printf '%s\n' "$package_info"
          printf '%s' "$package_info" | grep -F "package: name='com.vividcinema.app'"
          printf '%s' "$package_info" | grep -F "versionName='$VIVID_ANDROID_VERSION'"
          printf '%s' "$package_info" | grep -F "versionCode='$VIVID_ANDROID_VERSION_CODE'"
          "$aapt_path" dump permissions release-output/Vivid-Cinema-Android.apk | grep -F "android.permission.REQUEST_INSTALL_PACKAGES"
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("release-output/Vivid-Cinema-Android-build-" + process.env.VIVID_ANDROID_BUILD + ".json", JSON.stringify({version: process.env.VIVID_ANDROID_VERSION, build: Number(process.env.VIVID_ANDROID_BUILD), versionCode: Number(process.env.VIVID_ANDROID_VERSION_CODE), packageName: "com.vividcinema.app", distribution: "direct"}, null, 2))'
          sha256sum release-output/Vivid-Cinema-Android.apk > release-output/Vivid-Cinema-Android-SHA256.txt
          test -s release-output/Vivid-Cinema-Android-build-"$VIVID_ANDROID_BUILD".json

      - name: Verify the shared Vivid Cinema launcher icon
        shell: bash
        run: |
          set -euo pipefail
          apk="release-output/Vivid-Cinema-Android.apk"
          expected="$(sha256sum icons/vivid-icon-180.png | cut -d ' ' -f 1)"
          actual="$(unzip -p "$apk" res/drawable-nodpi-v4/vivid_icon_foreground.png | sha256sum | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
          unzip -l "$apk" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'

      - name: Download the previous Android APK for in-place upgrade verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-output/legacy
          gh release download v1.0.46 --repo "$GITHUB_REPOSITORY" --pattern "Vivid-Cinema-Android.apk" --dir release-output/legacy
          test -s release-output/legacy/Vivid-Cinema-Android.apk
      - name: Install and resume the APK on an Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            legacy_apk="release-output/legacy/Vivid-Cinema-Android.apk"
            apk="release-output/Vivid-Cinema-Android.apk"
            adb install "$legacy_apk"
            legacy_launch="$(adb shell am start -W -n com.vividcinema.app/.MainActivity)"
            printf '%s\\n' "$legacy_launch"
            printf '%s' "$legacy_launch" | grep -q "Status: ok"
            sleep 5
            adb install -r "$apk"
            launch="$(adb shell am start -W -n com.vividcinema.app/.MainActivity)"
            printf '%s\\n' "$launch"
            printf '%s' "$launch" | grep -q "Status: ok"
            sleep 15
            package_dump="$(adb shell dumpsys package com.vividcinema.app)"
            printf '%s\\n' "$package_dump" | grep -F "versionName=$VIVID_ANDROID_VERSION"
            printf '%s\\n' "$package_dump" | grep -F "versionCode=$VIVID_ANDROID_VERSION_CODE"
            pid="$(adb shell pidof com.vividcinema.app | tr -d '\r')"
            test -n "$pid"
            adb logcat -d --pid="$pid" > "$RUNNER_TEMP/vivid-android-emulator.log"
            if grep -E "FATAL EXCEPTION|Fatal signal|Process: com\\.vividcinema\\.app" "$RUNNER_TEMP/vivid-android-emulator.log"; then
              echo "Vivid Cinema crashed during Android install or in-place upgrade."
              exit 1
            fi
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n com.vividcinema.app/.MainActivity | grep -q "Status: ok"
            sleep 3
            test -n "$(adb shell pidof com.vividcinema.app | tr -d '\r')"
      - name: Publish the independent Android v1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_VERSION_INPUT: ${{ needs.release-guard.outputs.android_version }}
          LEGACY_BRIDGE_TAG: ${{ needs.release-guard.outputs.legacy_bridge_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-v$ANDROID_VERSION_INPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Android release $tag already exists. Choose the next Android version."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" --method POST \
            -f "tag_name=$tag" \
            -f "name=Vivid Cinema Android $ANDROID_VERSION_INPUT" \
            -f "body=Fresh Vivid Cinema Android direct-distribution release. This Android version and update feed are independent of Windows desktop releases. Existing sideloaded installations can update in place because this APK retains the established Android application ID and signing identity." \
            -f "draft=true" -f "prerelease=false" -f "make_latest=false" > "$RUNNER_TEMP/android-release.json"
          release_id="$(jq -r '.id' "$RUNNER_TEMP/android-release.json")"
          test -n "$release_id"
          gh release upload "$tag" \
            release-output/Vivid-Cinema-Android.apk \
            "release-output/Vivid-Cinema-Android-build-$VIVID_ANDROID_BUILD.json" \
            release-output/Vivid-Cinema-Android-SHA256.txt \
            --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "Vivid-Cinema-Android.apk"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "Vivid-Cinema-Android-build-$VIVID_ANDROID_BUILD.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --method PATCH -f "draft=false" -f "make_latest=false" >/dev/null
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -Fx "false"

          # One-time bridge: the currently installed legacy updater only queries
          # the GitHub latest release endpoint (the Windows release). Attach the
          # exact same signed APK there once so those users can migrate to the
          # new Android-only release feed. New Android builds use android-v* tags.
          if [ -n "$LEGACY_BRIDGE_TAG" ]; then
            gh release view "$LEGACY_BRIDGE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            bridge_apk="release-output/Vivid-Cinema-Android-$ANDROID_VERSION_INPUT-build-$VIVID_ANDROID_BUILD.apk"
            cp release-output/Vivid-Cinema-Android.apk "$bridge_apk"
            gh release upload "$LEGACY_BRIDGE_TAG" \
              "$bridge_apk" \
              "release-output/Vivid-Cinema-Android-build-$VIVID_ANDROID_BUILD.json" \
              --repo "$GITHUB_REPOSITORY" --clobber
            echo "Added a one-time Android migration asset to $LEGACY_BRIDGE_TAG for legacy installed apps."
          fi

      - name: Upload the verified APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-android-v1-${{ needs.release-guard.outputs.android_version }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 90
