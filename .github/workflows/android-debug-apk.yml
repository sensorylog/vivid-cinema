name: Android debug APK

on:
  push:
    branches:
      - android-capacitor-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: |
          node --test tests/auth-verification.test.mjs tests/service-worker.test.mjs tests/adcash.test.mjs tests/android-native-polish.test.mjs
          npm run check:syntax

      - name: Generate Android project
        run: npx cap add android

      - name: Bundle local website and sync Capacitor
        run: npm run cap:sync

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
