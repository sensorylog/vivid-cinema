name: Refresh Vivid Cinema web news

on:
  push:
    paths:
      - ".github/workflows/refresh-static-news.yml"
      - "automation/build-static-news-feed.mjs"
      - "automation/static-news-images.mjs"
      - "scripts/newsroom.js"
      - "styles/vivid-news.css"
      - "news.html"
      - "service-worker.js"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vivid-news-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch fresh, attributed headlines from public RSS feeds
        run: node automation/build-static-news-feed.mjs
      - name: Publish changed feed to the primary Netlify site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-feed.json
          if git diff --cached --quiet; then
            echo "News feed did not change; no deployment commit is needed."
            exit 0
          fi
          git commit -m "chore: refresh entertainment news feed"
          git push origin HEAD:main
