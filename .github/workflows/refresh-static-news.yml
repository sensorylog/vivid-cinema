name: Refresh Vivid Cinema web news

on:
  push:
    paths:
      - ".github/workflows/refresh-static-news.yml"
      - "automation/build-static-news-feed.mjs"
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch attributed headlines from public RSS feeds
        run: node automation/build-static-news-feed.mjs
      - name: Publish updated static feed to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIVID_CINEMA }}"
          projectId: vivid-cinema
          channelId: live
