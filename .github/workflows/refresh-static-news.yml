name: Refresh Vivid Cinema web news

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vivid-static-news-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch attributed headlines from public RSS feeds
        run: node automation/build-static-news-feed.mjs
      - name: Commit feed when it changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/news-feed.json; then
            echo "News feed unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-feed.json
          git commit -m "Refresh automatically collected news headlines"
          git push
