name: Vivid Cinema CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === ".git" || entry.name === "node_modules") continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith(".json")) JSON.parse(fs.readFileSync(full, "utf8"));
            }
          }
          walk(".");
          NODE

      - name: Validate local JavaScript imports
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = process.cwd();
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === ".git" || entry.name === "node_modules") continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith(".js")) files.push(full);
            }
          }
          walk(root);
          const missing = [];
          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            for (const match of source.matchAll(/(?:from|import)\s*\(?\s*["'](\.\/?[^"']+)["']/g)) {
              const ref = match[1];
              const candidates = [ref, ref + ".js", ref + "/index.js"];
              if (!candidates.some(candidate => fs.existsSync(path.resolve(path.dirname(file), candidate)))) {
                missing.push(file + " -> " + ref);
              }
            }
          }
          if (missing.length) {
            console.error("Missing local JavaScript imports:");
            console.error(missing.join("\n"));
            process.exit(1);
          }
          NODE


      - name: Validate app shell and service worker assets
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = process.cwd();
          const requiredPages = ["home.html","discover.html","library.html","news.html","search.html","title.html","watch.html","collection.html","anime.html","person.html","account.html","auth.html","login.html","community.html","news-story.html","moderator.html"];
          const failures = [];
          for (const file of requiredPages) {
            const source = fs.readFileSync(file, "utf8");
            if (!/<main\b/i.test(source)) failures.push(file + " -> missing <main>");
            if (!/scripts\/app-shell\.js/.test(source)) failures.push(file + " -> missing app shell");
          }
          const sw = fs.readFileSync("service-worker.js", "utf8");
          const shell = [...sw.matchAll(/"((?:\.\/)[^"]+)"/g)].map(match => match[1]).filter(asset => asset.startsWith("./"));
          for (const asset of shell) {
            if (!fs.existsSync(path.resolve(root, asset.split("?")[0].split("#")[0]))) failures.push("service-worker.js -> missing " + asset);
          }
          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Validate internal navigation targets
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = process.cwd();
          const htmlFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === ".git" || entry.name === "node_modules") continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith(".html")) htmlFiles.push(full);
            }
          }
          walk(root);
          const missing = [];
          for (const file of htmlFiles) {
            const source = fs.readFileSync(file, "utf8");
            for (const match of source.matchAll(/(?:href|action)\s*=\s*["']([^"']+)["']/gi)) {
              let ref = match[1];
              if (/^(?:https?:|mailto:|tel:|javascript:|data:|blob:|#)/i.test(ref)) continue;
              ref = ref.split("#")[0].split("?")[0];
              if (!ref || !/\.html$/i.test(ref)) continue;
              const target = path.resolve(path.dirname(file), ref);
              if (target.startsWith(root + path.sep) && !fs.existsSync(target)) missing.push(file + " -> " + ref);
            }
          }
          if (missing.length) {
            console.error("Missing internal navigation targets:");
            console.error(missing.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Validate local HTML/CSS/JS references
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const root = process.cwd();
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === ".git" || entry.name === "node_modules") continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && /\.(html|css)$/.test(entry.name)) files.push(full);
            }
          }
          walk(root);
          const missing = [];
          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            const refs = [];
            if (file.endsWith(".html")) {
              refs.push(...[...source.matchAll(/(?:href|src)\s*=\s*["']([^"']+)["']/gi)].map(match => match[1]));
            }
            refs.push(...[...source.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)].map(match => match[1]));
            for (let ref of refs) {
              if (!ref || /^(?:https?:|data:|blob:|mailto:|tel:|about:|#|javascript:)/i.test(ref)) continue;
              ref = ref.split("#")[0].split("?")[0];
              if (!ref) continue;
              const target = path.resolve(path.dirname(file), ref);
              if (!target.startsWith(root + path.sep) && target !== root) continue;
              if (!fs.existsSync(target)) missing.push(file + " -> " + ref);
            }
          }
          if (missing.length) {
            console.error("Missing local references:");
            console.error(missing.join("\n"));
            process.exit(1);
          }
          NODE

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install rules-test dependencies
        run: npm install --prefix tests

      - name: Run Firestore Emulator security tests
        run: npm --prefix tests run test:rules
