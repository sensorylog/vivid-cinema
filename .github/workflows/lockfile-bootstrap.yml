name: Temporary lockfile generation for release hardening

on:
  push:
    branches:
      - hardening/p0-p2-release-quality

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-generated-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
