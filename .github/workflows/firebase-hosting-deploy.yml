name: Deploy Vivid Cinema to Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Firestore security rules before hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIVID_CINEMA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase deployment credentials are not configured."
            exit 1
          fi
          credentials_path="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credentials_path"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
          chmod 600 "$credentials_path"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_path"
          npm install --no-save --no-audit --no-fund firebase-tools
          npx firebase-tools deploy --only firestore:rules --project vivid-cinema --non-interactive

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIVID_CINEMA }}"
          projectId: vivid-cinema
          channelId: live
