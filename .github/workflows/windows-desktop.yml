name: Vivid Cinema Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "*.html"
      - "scripts/**"
      - "service-worker.js"
      - "firebase.json"
      - "init.json"
      - "desktop/**"
      - "icons/**"
      - "tests/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
      - "vivid-v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run desktop packaging contract tests
        run: node --test tests/desktop-build.test.mjs
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run existing repository regression tests
        run: npm test
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vivid-v')
        shell: pwsh
        run: |
          $expected = "v" + (node -p "require('./package.json').version")
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME must match package version tag $expected"
          }
      - name: Build and publish auto-updatable Windows release
        if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vivid-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:publish
      - name: Build Windows installer and portable executable
        if: "!startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/vivid-v')"
        run: npm run desktop:dist
      - name: Upload Windows build artifacts
        if: "!startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/vivid-v')"
        uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
