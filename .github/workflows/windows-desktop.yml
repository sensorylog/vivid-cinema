name: Vivid Cinema Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "*.html"
      - "scripts/**"
      - "service-worker.js"
      - "firebase.json"
      - "init.json"
      - "desktop/**"
      - "icons/**"
      - "tests/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
      - "vivid-v*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run desktop packaging contract tests
        run: node --test tests/desktop-build.test.mjs
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run existing repository regression tests
        run: npm test
      - name: Decide whether this push publishes a release
        id: release-decision
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $version = node -p "require('./package.json').version"
          $publish = $false
          if ($env:GITHUB_REF -eq "refs/heads/main" -and $env:BEFORE_SHA -match '^[0-9a-f]{40}
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
 -and $env:BEFORE_SHA -ne "0000000000000000000000000000000000000000") {
            $previousJson = git show "$($env:BEFORE_SHA):package.json"
            if ($LASTEXITCODE -eq 0) {
              $previousVersion = ($previousJson | ConvertFrom-Json).version
              if ($previousVersion -ne $version) { $publish = $true }
            }
          }
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF -notlike "refs/tags/vivid-v*") {
            $expected = "v" + $version
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "Release tag $env:GITHUB_REF_NAME must match package version tag $expected"
            }
            $publish = $true
          }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Build and publish auto-updatable Windows release
        if: steps.release-decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run desktop:publish
      - name: Build Windows installer and portable executable
        if: steps.release-decision.outputs.publish != 'true'
        run: npm run desktop:dist
      - name: Upload Windows build artifacts
        if: steps.release-decision.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
