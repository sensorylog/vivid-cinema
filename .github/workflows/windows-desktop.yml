name: Vivid Cinema Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "*.html"
      - "scripts/**"
      - "service-worker.js"
      - "firebase.json"
      - "init.json"
      - "desktop/**"
      - "icons/**"
      - "licenses/**"
      - "tests/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run desktop packaging contract tests
        run: node --test tests/desktop-build.test.mjs
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run existing repository regression tests
        run: npm test
      - name: Decide whether this push publishes a release
        id: release-decision
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $version = node -p "require('./package.json').version"
          $publish = $false
          if ($env:GITHUB_REF -eq "refs/heads/main" -and $env:BEFORE_SHA -match '^[0-9a-f]{40}$' -and $env:BEFORE_SHA -ne "0000000000000000000000000000000000000000") {
            $previousJson = git show "$($env:BEFORE_SHA):package.json"
            if ($LASTEXITCODE -eq 0) {
              $previousVersion = ($previousJson | ConvertFrom-Json).version
              if ($previousVersion -ne $version) { $publish = $true }
            }
          }
          if ($env:GITHUB_REF -eq "refs/heads/main") {
            $tag = "v$version"
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if (!$existingTag) { $publish = $true }
          }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Install desktop runtime dependencies
        run: npm --prefix desktop ci --omit=dev --no-audit --no-fund
      - name: Enforce mpv corresponding-source bundle before public release
        if: steps.release-decision.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (!(Test-Path "licenses/mpv/CORRESPONDING-SOURCE.zip")) {
            throw "Refusing to publish mpv: the complete corresponding-source archive is missing."
          }
          if (!(Test-Path "licenses/mpv/SOURCE-MANIFEST.json")) {
            throw "Refusing to publish mpv: the source manifest is missing."
          }
      - name: Prepare checksum-pinned mpv Advanced Player runtime
        if: steps.release-decision.outputs.publish == 'true'
        run: node desktop/prepare-mpv.cjs
      - name: Verify mpv runtime and redistribution notice
        if: steps.release-decision.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/vendor/mpv/mpv.exe")) {
            throw "The checksum-verified mpv runtime was not prepared."
          }
          $runtime = Get-Content "desktop/vendor/mpv/vivid-mpv-runtime.json" | ConvertFrom-Json
          if ($runtime.sha256 -ne "24a5ac969219767c617f5d109761d4e24db8ba05dee30db485ea756415dc63b4") {
            throw "The bundled mpv runtime does not match the approved checksum."
          }
          if (!(Test-Path "licenses/mpv/NOTICE.md")) {
            throw "The mpv third-party redistribution notice is missing."
          }
      - name: Verify the desktop download engine with a local seeded torrent
        timeout-minutes: 3
        run: node --test tests/desktop-download-engine.integration.test.cjs
      - name: Ensure matching release tag exists before publishing
        if: steps.release-decision.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            throw "Release tag $tag already exists. Bump package.json to a new version before publishing."
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $tag -m "Vivid Cinema $version"
          git push origin "refs/tags/$tag"
      - name: Build auto-updatable Windows release files
        if: steps.release-decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm --ignore-scripts run desktop:dist
      - name: Verify updater metadata was generated
        if: steps.release-decision.outputs.publish == 'true'
        shell: pwsh
        run: |
          if (!(Test-Path "dist-desktop/latest.yml")) {
            throw "electron-builder did not generate dist-desktop/latest.yml; this release would break in-app update discovery."
          }
          $blockMap = Get-ChildItem "dist-desktop/Vivid-Cinema-Setup-*.exe.blockmap" -ErrorAction SilentlyContinue
          if (!$blockMap) {
            throw "Installer blockmap was not generated; refusing to publish an incomplete update."
          }
      - name: Publish installer and updater metadata together
        if: steps.release-decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $installer = Get-ChildItem "dist-desktop/Vivid-Cinema-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $portable = Get-ChildItem "dist-desktop/Vivid-Cinema-Portable-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $blockMap = Get-ChildItem "dist-desktop/Vivid-Cinema-Setup-*.exe.blockmap" -ErrorAction SilentlyContinue | Select-Object -First 1
          $metadata = Get-Item "dist-desktop/latest.yml" -ErrorAction SilentlyContinue
          $sourceBundle = Get-Item "licenses/mpv/CORRESPONDING-SOURCE.zip" -ErrorAction SilentlyContinue
          if (!$installer -or !$portable -or !$blockMap -or !$metadata -or !$sourceBundle) {
            throw "Installer, portable executable, blockmap, updater metadata, and mpv source bundle must all exist before publishing."
          }
          gh release create $tag $installer.FullName $portable.FullName $blockMap.FullName $metadata.FullName $sourceBundle.FullName --verify-tag --title "Vivid Cinema $version" --notes "Vivid Cinema Windows release $version. Includes installer, portable executable, in-app update metadata, and mpv corresponding source."
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release upload failed for $tag."
          }
      - name: Verify published updater assets
        if: steps.release-decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/sensorylog/vivid-cinema/releases/tags/$tag" -Headers $headers
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredAssets = @("Vivid-Cinema-Setup-$version.exe", "Vivid-Cinema-Portable-$version.exe", "Vivid-Cinema-Setup-$version.exe.blockmap", "latest.yml", "CORRESPONDING-SOURCE.zip")
          foreach ($assetName in $requiredAssets) {
            if ($assetNames -notcontains $assetName) {
              throw "Published release $tag is missing required updater asset: $assetName"
            }
          }
      - name: Upload verified Windows release files
        if: steps.release-decision.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
            dist-desktop/Vivid-Cinema-Setup-*.exe.blockmap
            dist-desktop/latest.yml
            licenses/mpv/CORRESPONDING-SOURCE.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build Windows installer and portable executable
        if: steps.release-decision.outputs.publish != 'true'
        env:
          VIVID_SKIP_MPV_PREPARE: "1"
        run: npm run desktop:dist
      - name: Upload Windows build artifacts
        if: steps.release-decision.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
