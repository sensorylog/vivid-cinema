name: Vivid Cinema Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "*.html"
      - "scripts/**"
      - "service-worker.js"
      - "firebase.json"
      - "init.json"
      - "desktop/**"
      - "icons/**"
      - "licenses/**"
      - "tests/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run desktop packaging contract tests
        run: node --test tests/desktop-build.test.mjs
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run existing repository regression tests
        run: npm test
      - name: Decide whether this push publishes a release
        id: release-decision
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $publish = $false
          if ($env:GITHUB_REF -eq "refs/heads/main" -and $env:BEFORE_SHA -match '^[0-9a-f]{40}$' -and $env:BEFORE_SHA -ne "0000000000000000000000000000000000000000") {
            $previousJson = git show "$($env:BEFORE_SHA):package.json"
            if ($LASTEXITCODE -eq 0) {
              $previousVersion = ($previousJson | ConvertFrom-Json).version
              if ($previousVersion -ne $version) { $publish = $true }
            }
          }
          if ($env:GITHUB_REF -eq "refs/heads/main") {
            $tag = "v$version"
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if (!$existingTag) {
              $publish = $true
            } else {
              $draftState = gh release view $tag --json isDraft -q .isDraft 2>$null
              if ($LASTEXITCODE -eq 0 -and $draftState -eq "true") { $publish = $true }
            }
          }
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Install desktop runtime dependencies
        working-directory: desktop
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Verify desktop runtime lockfile is synchronized
        run: node -e "const p=require('./desktop/package.json');const l=require('./desktop/package-lock.json');if(l.name!==p.name||l.version!==p.version||JSON.stringify(l.packages[''].dependencies)!==JSON.stringify(p.dependencies))process.exit(1)"
      - name: Test local FFmpeg transcode engine
        run: node --test tests/desktop-local-transcode.test.cjs
      - name: Verify the desktop download engine with a local seeded torrent
        timeout-minutes: 3
        run: node --test tests/desktop-download-engine.integration.test.cjs
      - name: Ensure matching release tag exists before publishing
        if: steps.release-decision.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch existing release tag $tag." }
            $tagCommit = git rev-list -n 1 $tag
            if ($tagCommit -ne $env:GITHUB_SHA) {
              git merge-base --is-ancestor $tagCommit $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw "Release tag $tag is not an ancestor of the recovery commit." }
              $changedFiles = @(git diff --name-only "$tagCommit..$env:GITHUB_SHA")
              $allowedFiles = @(".github/workflows/windows-desktop.yml", "tests/desktop-build.test.mjs", "data/news-feed.json")
              $unexpectedFiles = @($changedFiles | Where-Object { $allowedFiles -notcontains $_ })
              if ($unexpectedFiles.Count -gt 0) {
                throw "Release tag $tag points to a different app build. Only release workflow recovery changes may follow the tag."
              }
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a $tag $env:GITHUB_SHA -m "Vivid Cinema $version"
            git push origin "refs/tags/$tag"
          }
      - name: Create or reuse draft release for electron-builder
        if: steps.release-decision.outputs.publish == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $draftState = gh release view $tag --json isDraft -q .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draftState -ne "true") {
              throw "Release $tag is already public. Refusing to overwrite a published release."
            }
          } else {
            gh release create $tag --verify-tag --draft --title "Vivid Cinema $version" --notes "Vivid Cinema Windows release $version. Draft remains private until installer, portable executable, and updater metadata are verified."
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create draft release $tag for electron-builder."
            }
          }
      - name: Build auto-updatable Windows release files
        id: build-release
        if: steps.release-decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $requiredAssets = @("Vivid-Cinema-Setup-$version.exe", "Vivid-Cinema-Portable-$version.exe", "Vivid-Cinema-Setup-$version.exe.blockmap", "latest.yml")
          $buildNeeded = $true
          $releaseJson = gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            $assetNames = @($release.assets | ForEach-Object { $_.name })
            $missingAssets = @($requiredAssets | Where-Object { $assetNames -notcontains $_ })
            if ($release.isDraft -and $missingAssets.Count -eq 0) { $buildNeeded = $false }
          }
          if ($buildNeeded) {
            npm --ignore-scripts run desktop:dist
            if ($LASTEXITCODE -ne 0) { throw "electron-builder failed for release $tag." }
            "built=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "All required Windows release assets already exist in the draft; reusing the verified build."
            "built=false" >> $env:GITHUB_OUTPUT
          }
      - name: Verify updater metadata was generated
        if: steps.release-decision.outputs.publish == 'true' && steps.build-release.outputs.built == 'true'
        shell: pwsh
        run: |
          if (!(Test-Path "dist-desktop/latest.yml")) {
            throw "electron-builder did not generate dist-desktop/latest.yml; this release would break in-app update discovery."
          }
          $blockMap = Get-ChildItem "dist-desktop/Vivid-Cinema-Setup-*.exe.blockmap" -ErrorAction SilentlyContinue
          if (!$blockMap) {
            throw "Installer blockmap was not generated; refusing to publish an incomplete update."
          }
      - name: Verify draft release contains all required assets
        if: steps.release-decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          $releaseJson = gh release view $tag --json isDraft,assets
          if ($LASTEXITCODE -ne 0) { throw "Could not read draft release $tag through GitHub CLI." }
          $release = $releaseJson | ConvertFrom-Json
          if (!$release.isDraft) {
            throw "Release $tag must remain a draft until every asset has been verified."
          }
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          $requiredAssets = @("Vivid-Cinema-Setup-$version.exe", "Vivid-Cinema-Portable-$version.exe", "Vivid-Cinema-Setup-$version.exe.blockmap", "latest.yml")
          foreach ($assetName in $requiredAssets) {
            if ($assetNames -notcontains $assetName) {
              throw "Published release $tag is missing required updater asset: $assetName"
            }
          }
      - name: Upload verified Windows release files
        if: steps.release-decision.outputs.publish == 'true' && steps.build-release.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
            dist-desktop/Vivid-Cinema-Setup-*.exe.blockmap
            dist-desktop/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified Windows release
        if: steps.release-decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "All assets were built and verified, but GitHub could not publish release $tag."
          }
          $draftState = gh release view $tag --json isDraft -q .isDraft
          if ($LASTEXITCODE -ne 0 -or $draftState -ne "false") {
            throw "Release $tag did not become public after verification."
          }
      - name: Build Windows installer and portable executable
        if: steps.release-decision.outputs.publish != 'true'
        run: npm run desktop:dist
      - name: Upload Windows build artifacts
        if: steps.release-decision.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
