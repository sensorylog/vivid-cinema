name: Vivid Cinema Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "vivid-v*"

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run desktop packaging contract tests
        run: node --test tests/desktop-build.test.mjs
      - name: Run existing repository regression tests
        run: npm test
      - name: Build Windows installer and portable executable
        run: npm run desktop:dist
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: vivid-cinema-windows-${{ github.run_number }}
          path: |
            dist-desktop/Vivid-Cinema-Setup-*.exe
            dist-desktop/Vivid-Cinema-Portable-*.exe
          if-no-files-found: error
          retention-days: 30
