name: Quality checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Test playback URL builders and service-worker assets
        run: npm test
      - name: Test Firestore security rules in the emulator
        run: npm run test:rules
