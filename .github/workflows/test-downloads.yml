name: Vivid download system tests

on:
  push:
    branches:
      - feat/automatic-movie-download-sources
    paths:
      - "scripts/downloads/**"
      - "scripts/title.js"
      - "scripts/my-downloads.js"
      - "my-downloads.html"
      - "styles/my-downloads.css"
      - "functions/index.js"
      - "functions/package.json"
      - "tests/download*.test.mjs"
      - "tests/cloudflare-pages-config.test.mjs"
      - "package.json"
      - "_headers"
      - "service-worker.js"
      - "tests/service-worker.test.mjs"
      - ".github/workflows/test-downloads.yml"
  pull_request:
    paths:
      - "scripts/downloads/**"
      - "scripts/title.js"
      - "scripts/my-downloads.js"
      - "my-downloads.html"
      - "styles/my-downloads.css"
      - "functions/index.js"
      - "functions/package.json"
      - "tests/download*.test.mjs"
      - "tests/cloudflare-pages-config.test.mjs"
      - "package.json"
      - "_headers"
      - ".github/workflows/test-downloads.yml"
      - "service-worker.js"
      - "tests/service-worker.test.mjs"

permissions:
  contents: read

jobs:
  test:
    name: Test download discovery, queue, proxy and resume
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check changed download modules
        run: |
          node --check scripts/downloads/browser-direct-adapter.js
          node --check scripts/my-downloads.js
          node --check scripts/title.js
          node --check functions/index.js

      - name: Run focused download regression tests
        run: |
          node --test \
            tests/download-manager.test.mjs \
            tests/download-indexeddb.test.mjs \
            tests/download-browser-adapter.test.mjs \
            tests/downloads-library-page.test.mjs \
            tests/downloads-page.test.mjs \
            tests/offline-playback.test.mjs \
            tests/title-download-flow.test.mjs \
            tests/download-source-identity.test.mjs \
            tests/download-browser-hls-adapter.test.mjs \
            tests/cloudflare-pages-config.test.mjs
