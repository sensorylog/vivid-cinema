name: Deploy Vivid media download backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vivid-media-download-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy downloadMedia HTTPS function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Check function syntax
        working-directory: functions
        run: npm run check

      - name: Deploy only the media download function
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VIVID_CINEMA }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase deployment credentials are not configured."
            exit 1
          fi
          credentials_path="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credentials_path"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
          chmod 600 "$credentials_path"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_path"
          npm install --no-save --no-audit --no-fund firebase-tools
          npx firebase-tools deploy --only functions:downloadMedia --project vivid-cinema --non-interactive
