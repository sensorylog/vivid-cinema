name: Vivid Cinema mpv Source-Build Candidate
on:
  pull_request:
    paths:
      - "desktop/**"
      - "licenses/mpv/**"
      - ".github/workflows/mpv-source-build.yml"
  workflow_dispatch:
concurrency:
  group: vivid-mpv-source-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-mpv-candidate:
    name: Build pinned mpv source candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout Vivid Cinema
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Windows cross-build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ccache g++-mingw-w64 gcc-multilib python3-pip nasm ninja-build \
            pkgconf wine wine64 wget zip unzip git cmake make
          python -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install "meson==1.9.2"
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
      - name: Build mpv and prepare source-compliance candidate
        run: bash desktop/build-mpv-source.sh
      - name: Upload candidate runtime and corresponding-source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: vivid-mpv-source-build-candidate
          path: |
            desktop/vendor/mpv/**
            licenses/mpv/CORRESPONDING-SOURCE.zip
            licenses/mpv/SOURCE-MANIFEST.json
            licenses/mpv/source-notices/**
          if-no-files-found: error
          retention-days: 30
      - name: Smoke-test the packaged Windows player (bounded, non-blocking)
        id: mpv-smoke-test
        timeout-minutes: 2
        continue-on-error: true
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 60s wine ./desktop/vendor/mpv/mpv.com --version --no-config
          result=$?
          if [ "$result" -eq 124 ] || [ "$result" -eq 137 ]; then
            echo "::warning::Wine smoke test exceeded 60 seconds; candidate artifact was already uploaded."
          elif [ "$result" -ne 0 ]; then
            echo "::warning::Wine smoke test exited with status $result; candidate artifact was already uploaded."
          fi
          exit 0
