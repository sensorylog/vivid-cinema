<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<title>Search · Vivid Cinema</title>
<link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="icon" href="icons/vivid-icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" sizes="180x180" href="icons/vivid-icon-180.png">
<link rel="stylesheet" href="styles/vivid-foundation.css">
<link rel="stylesheet" href="styles/vivid-system.css">
<link rel="stylesheet" href="styles/vivid-shell.css"><link rel="stylesheet" href="styles/vivid-audit-fixes.css">
<link rel="stylesheet" href="styles/vivid-cinematic.css">
<link rel="stylesheet" href="styles/vivid-search-standalone.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
<link rel="stylesheet" href="styles/vivid-desktop.css">
<link rel="stylesheet" href="styles/vivid-liquid-glass.css?v=lg4">
</head>
<body data-vivid-page="search" class="vivid-atmosphere vivid-search-page">
<header class="vivid-unified-header"><nav class="vivid-nav vivid-unified-nav" aria-label="Primary"></nav></header>
<main class="vivid-search-main">
  <section class="vivid-search-page-head" aria-labelledby="search-page-title">
    <div>
      <span class="vivid-search-kicker">VIVID SEARCH</span>
      <h1 id="search-page-title">Search everything.</h1>
    </div>
    <p>Movies, shows, people, genres, moods and more — one search across Vivid.</p>
  </section>
  <section class="vivid-search-page-field" aria-label="Search catalogue">
    <i class="bi bi-search" aria-hidden="true"></i>
    <input id="search-page-input" type="search" autocomplete="off" placeholder="Shows, Movies, and More" aria-label="Search shows, movies, and more">
    <button id="search-page-clear" type="button" aria-label="Clear search" hidden><i class="bi bi-x-lg" aria-hidden="true"></i></button>
  </section>
  <section class="vivid-search-quick" aria-label="Browse Vivid">
    <div class="vivid-search-quick-head"><div><span class="vivid-search-page-label">BROWSE VIVID</span><h2>Jump straight into a world.</h2></div><a href="discover.html">See all Browse <i class="bi bi-arrow-up-right" aria-hidden="true"></i></a></div>
    <div class="vivid-search-quick-grid">
      <a href="discover.html?type=movie"><i class="bi bi-film"></i><span>Movies</span></a>
      <a href="discover.html?type=tv"><i class="bi bi-tv"></i><span>TV Shows</span></a>
      <a href="discover.html?category=anime"><i class="bi bi-stars"></i><span>Anime</span></a>
      <a href="discover.html?category=africanCinema"><i class="bi bi-globe-africa"></i><span>African cinema</span></a>
      <a href="discover.html?mood=funny"><i class="bi bi-emoji-laughing"></i><span>Funny</span></a>
      <a href="discover.html?mood=romantic"><i class="bi bi-heart"></i><span>Romantic</span></a>
      <a href="discover.html?mood=intense"><i class="bi bi-lightning-charge"></i><span>Intense</span></a>
      <a href="discover.html?mood=late"><i class="bi bi-moon-stars"></i><span>Late-night</span></a>
      <a href="discover.html?category=kDrama"><i class="bi bi-globe2"></i><span>K-Dramas</span></a>
      <a href="discover.html?category=bollywood"><i class="bi bi-camera-reels"></i><span>Bollywood</span></a>
      <a href="discover.html?category=nollywood"><i class="bi bi-film"></i><span>Nollywood</span></a>
      <a href="discover.html?category=hiddenGems"><i class="bi bi-gem"></i><span>Hidden gems</span></a>
    </div>
  </section>
  <section id="search-page-content" class="vivid-search-page-content" aria-live="polite"></section>
</main>
<script type="module" src="scripts/app-shell.js"></script>
<script type="module" src="scripts/search-page.js"></script>
<script type="module" src="scripts/atmosphere.js"></script>
<script type="module" src="scripts/pwa.js"></script></body>
</html>
