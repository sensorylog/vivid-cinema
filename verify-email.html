<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="Verify your email address to finish setting up your Vivid Cinema account.">
  <title>Verify Email · Vivid Cinema</title>
  <link rel="stylesheet" href="styles/vivid-system.css">

<body class="vivid-atmosphere" data-vivid-page="auth">

  <main class="auth-container" aria-live="polite">
    <div id="verification-mark" aria-hidden="true" style="font-size:2.5rem;margin-bottom:1rem">✦</div>

  </main>
  <script type="module" src="scripts/app-shell.js"></script>
  <script type="module" src="scripts/verify-email.js?v=20261017-auth-baseline-1"></script>

</html>
