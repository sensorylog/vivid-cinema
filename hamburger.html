<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hamburger Menu Component</title>
  <!-- Styles for Hamburger + Mobile Filter Menu -->
  <style>
    :root {
      --hamburger-size: 24px;
      --hamburger-color: #fff;
      --menu-bg: #151515;
      --menu-text: #fff;
      --menu-border: #333;
      --transition-speed: 0.3s;
    }
    /* Hamburger Button */
    #hamburger-btn {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: var(--hamburger-size);
      height: var(--hamburger-size);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
      z-index: 1000;
    }
    #hamburger-btn .hamburger-line {
      width: 100%;
      height: 3px;
      background-color: var(--hamburger-color);
      border-radius: 2px;
      transition: transform var(--transition-speed) ease, opacity var(--transition-speed) ease;
    }
    /* Animate to X when open */
    #hamburger-btn.open .hamburger-line:nth-child(1) {
      transform: translateY(9px) rotate(45deg);
    }
    #hamburger-btn.open .hamburger-line:nth-child(2) {
      opacity: 0;
    }
    #hamburger-btn.open .hamburger-line:nth-child(3) {
      transform: translateY(-9px) rotate(-45deg);
    }
    /* Mobile Filter Menu */
    #mobile-filter-menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 280px;
      height: 100vh;
      background: var(--menu-bg);
      color: var(--menu-text);
      transform: translateX(100%);
      transition: transform var(--transition-speed) ease;
      z-index: 999;
      padding: 1rem;
      box-shadow: -2px 0 5px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    #mobile-filter-menu.open {
      transform: translateX(0);
    }
    #close-filter-menu {
      align-self: flex-end;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      color: var(--menu-text);
      cursor: pointer;
      margin-bottom: 1rem;
    }
    .filter-container h3 {
      margin-bottom: 1rem;
    }
    .filter-container label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .filter-container select {
      width: 100%;
      padding: 0.5rem;
      background: transparent;
      border: 1px solid var(--menu-border);
      border-radius: 4px;
      color: var(--menu-text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    #apply-filters {
      margin-top: auto;
      padding: 0.75rem;
      background: var(--hamburger-color);
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <!-- Hamburger Button -->
  <button id="hamburger-btn" aria-label="Toggle menu">
    <div class="hamburger-line"></div>
    <div class="hamburger-line"></div>
    <div class="hamburger-line"></div>
  </button>

  <!-- Mobile Filter Menu -->
  <div id="mobile-filter-menu">
    <button id="close-filter-menu" aria-label="Close menu">&times;</button>
    <h3>Filter Movies</h3>
    <label for="genre-select">Genre:</label>
    <select id="genre-select">
      <option value="">All Genres</option>
    </select>
    <label for="year-select">Year:</label>
    <select id="year-select">
      <option value="">All Years</option>
    </select>
    <button id="apply-filters">Apply Filters</button>
  </div>

  <!-- Script: Populate & Handle Filters -->
  <script>
  (function() {
    // Your TMDB API key
    const API_KEY = "6a46c44a2b36f3b6c206e5f19cafa558";
    const API_URL = 'https://api.themoviedb.org/3/genre/movie/list?language=en';

    const hamburgerBtn = document.getElementById('hamburger-btn');
    const mobileMenu = document.getElementById('mobile-filter-menu');
    const closeBtn = document.getElementById('close-filter-menu');
    const genreSelect = document.getElementById('genre-select');
    const yearSelect = document.getElementById('year-select');
    const applyBtn = document.getElementById('apply-filters');

    // Toggle menu open/close
    hamburgerBtn.addEventListener('click', () => {
      hamburgerBtn.classList.toggle('open');
      mobileMenu.classList.toggle('open');
    });
    closeBtn.addEventListener('click', () => {
      hamburgerBtn.classList.remove('open');
      mobileMenu.classList.remove('open');
    });

    // Populate years 2000–2025
    for (let year = 2025; year >= 2000; year--) {
      const opt = document.createElement('option');
      opt.value = year;
      opt.textContent = year;
      yearSelect.appendChild(opt);
    }

    // Fetch genres from TMDB
    async function loadGenres() {
      try {
        const res = await fetch(API_URL, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'accept': 'application/json',
          }
        });
        const data = await res.json();
        data.genres.forEach(({ id, name }) => {
          const opt = document.createElement('option');
          opt.value = id;
          opt.textContent = name;
          genreSelect.appendChild(opt);
        });
      } catch (e) {
        console.error('Error loading genres:', e);
      }
    }
    loadGenres();

    // Apply filters
    applyBtn.addEventListener('click', () => {
      const genreId = genreSelect.value;
      const year = yearSelect.value;

      let filtered = window.allMovies || [];
      if (genreId) {
        filtered = filtered.filter(m => m.genre_ids && m.genre_ids.includes(parseInt(genreId)));
      }
      if (year) {
        filtered = filtered.filter(m => (m.release_date || '').startsWith(year));
      }

      if (typeof window.renderAllMovies === 'function') {
        window.renderAllMovies(filtered);
      }

      // Close menu
      hamburgerBtn.classList.remove('open');
      mobileMenu.classList.remove('open');
    });
  })();
  </script>
</body>
</html>
